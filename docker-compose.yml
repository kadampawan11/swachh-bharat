services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: swachh-postgres
    environment:
      POSTGRES_USER: swachh
      POSTGRES_PASSWORD: swachh
      POSTGRES_DB: swachh_bharat
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
